name: 💡 功能建议 / Feature request
description: 提出一个新功能或改进想法 / Suggest a new feature or improvement
labels: [ "enhancement" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / The problem
      description: 描述场景，而不是直接描述方案。你想解决什么？
      placeholder: |
        辅导完一个单元后，我想一次看到这个孩子所有科目的薄弱点分布，
        现在只能按记录逐条翻。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案 / Proposed solution
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案 / Alternatives considered
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围 / Area
      options:
        - 录音与转写 Recording & transcription
        - 薄弱点分析 Weak-point analysis
        - 复习排期 Review scheduling
        - 孩子端 Kid mode
        - 工作端 Work mode
        - 积分与激励 Points & rewards
        - 备份与存储 Backup & storage
        - 界面与体验 UI / UX
        - 其他 Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Checklist
      options:
        - label: 我已经搜索过现有 Issues，没有重复
          required: true
